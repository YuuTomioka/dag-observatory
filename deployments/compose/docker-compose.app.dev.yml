services:
  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      - POSTGRES_USER=dag
      - POSTGRES_PASSWORD=dag
      - POSTGRES_DB=dag
    ports:
      - "5432:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  dag-core-api:
    build:
      # Build from the Go module root so Dockerfile.dev can COPY go.mod/go.sum.
      context: ../../dag-core
      dockerfile: cmd/api/Dockerfile.dev
    environment:
      - HTTP_PORT=8080
      - SERVICE_NAME=dag-observatory-dag-core
      - ENV=dev
      - STATE_STORE_TYPE=bolt
      - BOLT_PATH=/data/dagruntime.bolt
      - EVENT_STORE_TYPE=kafka
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TASK_TOPIC=dagruntime-tasks
      - KAFKA_EVENT_TOPIC=dagruntime-events
      - KAFKA_TOPIC=dagruntime-events
      - KAFKA_GROUP_ID=dagruntime-worker
      - TSDB_URL=postgres://dag:dag@timescaledb:5432/dag?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_SECURE=false
      - MINIO_BUCKET=worker-results
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    ports:
      - "8080:8080"
    volumes:
      - ../../dag-core:/app
      - dag-core-data:/data
    depends_on:
      - timescaledb
      - minio
      - redpanda
      - otel-collector
      - loki
    networks:
      - default

  worker-py:
    build:
      context: ../../worker-py
      dockerfile: docker/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_IN_TOPIC=dagruntime-tasks
      - KAFKA_OUT_TOPIC=dagruntime-events
      - KAFKA_TOPIC=dagruntime-events
      - KAFKA_GROUP_ID=dagruntime-worker-py
      - TSDB_URL=postgres://dag:dag@timescaledb:5432/dag?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_SECURE=false
      - MINIO_BUCKET=worker-results
      - SERVICE_NAME=dag-observatory-worker-py
      - ENV=dev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - timescaledb
      - minio
      - redpanda
      - otel-collector
    networks:
      - default

  worker-py-outbox:
    build:
      context: ../../worker-py
      dockerfile: docker/Dockerfile
    command: ["worker-py-outbox"]
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_OUT_TOPIC=dagruntime-events
      - KAFKA_TOPIC=dagruntime-events
      - KAFKA_GROUP_ID=dagruntime-worker-py-outbox
      - TSDB_URL=postgres://dag:dag@timescaledb:5432/dag?sslmode=disable
      - OUTBOX_POLL_INTERVAL_SEC=1.0
      - OUTBOX_BATCH_SIZE=100
      - SERVICE_NAME=dag-observatory-worker-py-outbox
      - ENV=dev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - timescaledb
      - redpanda
      - otel-collector
    networks:
      - default

  worker-py-gc:
    build:
      context: ../../worker-py
      dockerfile: docker/Dockerfile
    command: ["worker-py-gc"]
    environment:
      - SERVICE_NAME=dag-observatory-worker-py-gc
      - ENV=dev
      - TSDB_URL=postgres://dag:dag@timescaledb:5432/dag?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_SECURE=false
      - MINIO_BUCKET=worker-results
      - GC_POLL_INTERVAL_SEC=60
      - GC_EXPIRE_MINUTES=30
      - GC_BATCH_SIZE=100
    depends_on:
      - timescaledb
      - minio
    networks:
      - default

  redpanda:
    image: redpandadata/redpanda:v24.3.3
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  dag-core-data:
  redpanda-data:
  tsdb-data:
  minio-data:
