services:
  dag-core-api:
    build:
      # Build from the Go module root so Dockerfile.dev can COPY go.mod/go.sum.
      context: ../../dag-core
      dockerfile: cmd/api/Dockerfile.dev
    environment:
      - HTTP_PORT=8080
      - SERVICE_NAME=dag-observatory-dag-core
      - ENV=dev
      - STATE_STORE_TYPE=bolt
      - BOLT_PATH=/data/dagruntime.bolt
      - EVENT_STORE_TYPE=kafka
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TASK_TOPIC=dagruntime-tasks
      - KAFKA_EVENT_TOPIC=dagruntime-events
      - KAFKA_TOPIC=dagruntime-events
      - KAFKA_GROUP_ID=dagruntime-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    ports:
      - "8080:8080"
    volumes:
      - ../../dag-core:/app
      - dag-core-data:/data
    depends_on:
      - redpanda
      - otel-collector
      - loki
    networks:
      - default

  worker-py:
    build:
      context: ../../worker-py
      dockerfile: docker/Dockerfile
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_IN_TOPIC=dagruntime-tasks
      - KAFKA_OUT_TOPIC=dagruntime-events
      - KAFKA_TOPIC=dagruntime-events
      - KAFKA_GROUP_ID=dagruntime-worker-py
      - SERVICE_NAME=dag-observatory-worker-py
      - ENV=dev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - redpanda
      - otel-collector
    networks:
      - default

  redpanda:
    image: redpandadata/redpanda:v24.3.3
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  dag-core-data:
  redpanda-data:
