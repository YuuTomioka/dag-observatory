services:
  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ../promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/otel-collector.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics scrape (collector自身のメトリクスなど)
      - "9464:9464"   # Prometheus metrics scrape (アプリのOTelメトリクス)
    volumes:
      - ../otel-collector/otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"  # Tempo HTTP
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:10.4.5
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ../grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    depends_on:
      - otel-collector

volumes:
  tempo-data:
