receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resource/loki_labels:
    attributes:
      - action: upsert
        key: service
        from_attribute: service.name
      - action: upsert
        key: env
        from_attribute: deployment.environment
      - action: upsert
        key: instance
        from_attribute: service.instance.id
      - action: upsert
        key: job
        from_attribute: service.name
      - action: upsert
        key: app
        from_attribute: service.name
      - action: upsert
        key: loki.resource.labels
        value: service,env,app,instance,job
      - action: upsert
        key: loki.attribute.labels
        value: service,env,app,instance,job

exporters:
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # metrics は “捨てない”ために logging exporter を暫定で入れておく
  # 後で Prometheus に差し替える
  logging:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [resource/loki_labels, batch]
      exporters: [loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
