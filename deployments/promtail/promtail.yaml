server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          env: dev
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            trace_id:
            span_id:
            dag_run_id: dag.run_id
            event:
            level:
            msg:
    relabel_configs:
      - source_labels: [job]
        target_label: service
      - source_labels: [job]
        target_label: app
      - source_labels: [__path__]
        target_label: instance
        regex: ".*/([0-9a-f]{12})[0-9a-f]*-json\\.log"
        replacement: "$1"
