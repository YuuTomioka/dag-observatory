      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListArtifactsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List artifacts by workflow run
      tags:
      - artifacts
