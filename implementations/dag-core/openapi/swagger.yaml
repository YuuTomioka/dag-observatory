info:
  contact: {}
  description: DAG runtime HTTP API (auto-generated via swag).
  title: DAG Observatory API
  version: 0.1.0
paths:
  /algotrade/backtests:run:
    post:
      consumes:
      - application/json
      description: Triggers the configured runtime workflow as a backtest entrypoint
        over an explicit historical range and returns run correlation metadata.
      parameters:
      - description: Backtest run request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.backtestRunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BacktestRunResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.BacktestRunResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Run real-data backtest workflow
      tags:
      - algotrade
  /algotrade/equity:
    get:
      description: Returns equity and drawdown points reconstructed from closed trades
        in the selected partition or run scope.
      parameters:
      - description: Runtime partition
        in: query
        name: partition
        type: string
      - description: Run ID used to resolve partition scope when partition is omitted
        in: query
        name: run_id
        type: string
      - description: Symbol filter
        in: query
        name: symbol
        type: string
      - description: Position side filter (long/short)
        in: query
        name: side
        type: string
      - description: Exit-time lower bound (RFC3339 or RFC3339Nano, inclusive)
        in: query
        name: from
        type: string
      - description: Exit-time upper bound (RFC3339 or RFC3339Nano, exclusive)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.EquitySeriesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get equity/drawdown time series
      tags:
      - algotrade
  /algotrade/result-reflection:run:
    post:
      consumes:
      - application/json
      description: Triggers the configured runtime workflow as a result-reflection
        entrypoint. Intended for manual submit/fill/result-reflection verification
        with explicit partition control.
      parameters:
      - description: Result reflection run request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.resultReflectionRunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResultReflectionRunResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.ResultReflectionRunResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Run result reflection workflow
      tags:
      - algotrade
  /algotrade/summary:
    get:
      description: Returns strategy summary projection for the given runtime partition.
      parameters:
      - description: Runtime partition
        in: query
        name: partition
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.GetSummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get strategy summary
      tags:
      - algotrade
  /algotrade/trades:
    get:
      description: Returns closed-trade facts for the given runtime partition or run
        scope. This is a snapshot read path for result confirmation, not an observability
        event feed.
      parameters:
      - description: Runtime partition
        in: query
        name: partition
        type: string
      - description: Run ID used to resolve partition scope when partition is omitted
        in: query
        name: run_id
        type: string
      - description: Symbol filter
        in: query
        name: symbol
        type: string
      - description: Position side filter (long/short)
        in: query
        name: side
        type: string
      - description: Exit-time lower bound (RFC3339 or RFC3339Nano, inclusive)
        in: query
        name: from
        type: string
      - description: Exit-time upper bound (RFC3339 or RFC3339Nano, exclusive)
        in: query
        name: to
        type: string
      - description: Max items
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ListTradesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List closed trades
      tags:
      - algotrade
  /artifacts/{artifact_id}:presign-download:
    post:
      description: Returns a time-limited URL for downloading an artifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        type: string
      - description: Workflow run ID for access control
        in: query
        name: workflow_run_id
        required: true
        type: string
      - description: 'Expiry seconds (allowed: 60,300,900; default 900)'
        in: query
        name: expires
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PresignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Presign artifact download URL
      tags:
      - artifacts
  /dag/run:
    post:
      consumes:
      - application/json
      description: Triggers the configured workflow using generic runtime input. Prefer
        feature-local workflow endpoints when a dedicated endpoint exists and use
        this endpoint for runtime-level execution.
      parameters:
      - description: Run workflow request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RunRequest'
      - description: Override mode when body omits it
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.RunResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.RunResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Run workflow generically
      tags:
