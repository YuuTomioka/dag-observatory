info:
  contact: {}
  description: DAG runtime HTTP API (auto-generated via swag).
  title: DAG Observatory API
  version: 0.1.0
paths:
  /artifacts/{artifact_id}:presign-download:
    post:
      description: Returns a time-limited URL for downloading an artifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        type: string
      - description: Workflow run ID for access control
        in: query
        name: workflow_run_id
        required: true
        type: string
      - description: 'Expiry seconds (allowed: 60,300,900; default 900)'
        in: query
        name: expires
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PresignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Presign artifact download URL
      tags:
      - artifacts
  /dag/run:
    post:
      consumes:
      - application/json
      description: Triggers the configured workflow using generic runtime input. Prefer
        feature-local workflow endpoints when a dedicated endpoint exists.
      parameters:
      - description: Run workflow request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RunRequest'
      - description: Override mode when body omits it
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.RunResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.RunResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Run workflow generically
      tags:
      - dag
  /db-backups:
    get:
      description: Returns DB backup metadata filtered by env
      parameters:
      - description: Environment
        in: query
        name: env
        required: true
        type: string
      - description: Max items (default 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ListDBBackupsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List DB backups
      tags:
      - db-backups
  /db-backups/{backup_id}:presign-download:
    post:
      description: Returns a time-limited URL for downloading a DB backup object
      parameters:
      - description: Backup ID
        in: path
        name: backup_id
        required: true
        type: string
      - description: 'Expiry seconds (allowed: 60,300,900; default 900)'
        in: query
        name: expires
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PresignDBBackupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Presign DB backup download URL
      tags:
      - db-backups
  /healthz:
    get:
      description: Returns OK when server is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /marketdata/symbols:
    get:
      description: Returns market symbol master records
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ListSymbolsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List symbols
      tags:
      - marketdata
    post:
      consumes:
      - application/json
      description: Creates a market symbol master record
      parameters:
      - description: Create symbol request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateSymbolRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SymbolItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Create symbol
      tags:
      - marketdata
  /marketdata/symbols/{code}:
    get:
      description: Returns symbol metadata by symbol code
      parameters:
      - description: Symbol code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SymbolItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get symbol by code
      tags:
      - marketdata
  /marketdata/ticks:
    get:
      description: Returns ticks for symbol_id in [from, to)
      parameters:
      - description: Symbol ID
        in: query
        name: symbol_id
        required: true
        type: integer
      - description: From (RFC3339Nano)
        in: query
        name: from
        required: true
        type: string
      - description: To (RFC3339Nano)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ListTicksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List ticks by symbol and range
      tags:
      - marketdata
  /marketdata/ticks/latest:
    get:
      description: Returns latest tick by symbol id
      parameters:
      - description: Symbol ID
        in: query
        name: symbol_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TickItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get latest tick
      tags:
      - marketdata
  /marketdata/ticks:upsert-bulk:
    post:
      consumes:
      - application/json
      description: Upserts multiple ticks in a single transaction
      parameters:
      - description: Bulk tick upsert request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpsertTicksBulkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UpsertTicksBulkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Bulk upsert ticks
      tags:
      - marketdata
  /marketdata/timeframe-bars:backfill:
    post:
      consumes:
      - application/json
      description: Rebuilds timeframe bars immediately and returns aggregated bar
        counts for the requested symbol and range
      parameters:
      - description: Backfill timeframe bars request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BackfillTimeframeBarsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BackfillTimeframeBarsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Backfill timeframe bars directly
      tags:
      - marketdata
  /marketdata/timeframe-bars:backfill-workflow:
    post:
      consumes:
      - application/json
      description: Enqueues or runs the configured marketdata backfill workflow and
        returns workflow run information instead of backfill aggregation counts
      parameters:
      - description: Backfill timeframe bars workflow request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BackfillTimeframeBarsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BackfillTimeframeBarsWorkflowResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.BackfillTimeframeBarsWorkflowResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Trigger timeframe bar backfill workflow
      tags:
      - marketdata
  /workflow-runs/{workflow_run_id}/artifacts:
    get:
      description: Returns artifacts associated with a workflow run id
      parameters:
      - description: Workflow run ID
        in: path
        name: workflow_run_id
        required: true
        type: string
      - description: Max items (default 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ListArtifactsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List artifacts by workflow run
      tags:
      - artifacts
swagger: "2.0"
