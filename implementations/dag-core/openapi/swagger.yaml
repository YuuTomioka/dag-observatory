info:
  contact: {}
  description: DAG runtime HTTP API (auto-generated via swag).
  title: DAG Observatory API
  version: 0.1.0
paths:
  /artifacts/{artifact_id}:presign-download:
    post:
      description: Returns a time-limited URL for downloading an artifact
      parameters:
      - description: Artifact ID
        in: path
        name: artifact_id
        required: true
        type: string
      - description: Workflow run ID for access control
        in: query
        name: workflow_run_id
        required: true
        type: string
      - description: 'Expiry seconds (allowed: 60,300,900; default 900)'
        in: query
        name: expires
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PresignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Presign artifact download URL
      tags:
      - artifacts
  /dag/run:
    post:
      consumes:
      - application/json
      description: Triggers workflow execution (sync/async depending on backend)
      parameters:
      - description: Run workflow request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DagRunRequest'
      - description: Override mode when body omits it
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DagRunResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dto.DagRunResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Run workflow
      tags:
      - dag
  /db-backups:
    get:
      description: Returns DB backup metadata filtered by env
      parameters:
      - description: Environment
        in: query
        name: env
        required: true
        type: string
      - description: Max items (default 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListDBBackupsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List DB backups
      tags:
      - db-backups
  /db-backups/{backup_id}:presign-download:
    post:
      description: Returns a time-limited URL for downloading a DB backup object
      parameters:
      - description: Backup ID
        in: path
        name: backup_id
        required: true
        type: string
      - description: 'Expiry seconds (allowed: 60,300,900; default 900)'
        in: query
        name: expires
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PresignDBBackupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Presign DB backup download URL
      tags:
      - db-backups
  /healthz:
    get:
      description: Returns OK when server is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /workflow-runs/{workflow_run_id}/artifacts:
    get:
      description: Returns artifacts associated with a workflow run id
      parameters:
      - description: Workflow run ID
        in: path
        name: workflow_run_id
        required: true
        type: string
      - description: Max items (default 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
