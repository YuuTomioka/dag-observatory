# PURPOSE:
# - Extended breakout workflow with additional filters, risk, execution, and position-management nodes.
# - Intended for richer strategy validation beyond v0/minimal variants.
name: dagruntime.breakout_long_v1_extended
version: v1
inputs:
  - market.symbol
  - market.ohlcv_bars
  - market.spread_bps
  - account.balance
nodes:
  - id: atr
    kind: feature_atr
    config:
      window: 14

  - id: range_high
    kind: feature_range_high
    config:
      window: 20

  - id: range_low
    kind: feature_range_low
    config:
      window: 20

  - id: breakout_long
    kind: signal_breakout_long
    config:
      range_node_id: range_high

  - id: breakout_short
    kind: signal_breakout_short
    config:
      range_node_id: range_low

  - id: session_filter
    kind: filter_session
    config:
      signal_node_id: breakout_long
      allowed_sessions:
        - tokyo
        - london

  - id: spread_filter
    kind: filter_spread
    config:
      allowed_node_id: session_filter
      max_spread_bps: 5

  - id: sizing
    kind: risk_position_sizing
    config:
      allowed_node_id: spread_filter
      atr_node_id: atr
      risk_rate: 0.005
      stop_atr_multiple: 1.5

  - id: decision
    kind: signal_decision_mapper
    config:
      allowed_node_id: spread_filter
      sizing_node_id: sizing

  - id: observe_signal
    kind: observability_emit_signal_decision
    config:
      decision_node_id: decision

  - id: observe_order
    kind: observability_emit_order_decision
    config:
      decision_node_id: decision

  - id: market_exec
    kind: execution_submit_market_order
    config:
      decision_node_id: decision

  - id: position_load
    kind: position_snapshot_load

  - id: trailing
    kind: position_trailing_stop
    config:
      position_node_id: position_load

  - id: exit_basic
    kind: signal_exit_basic
    config:
      position_node_id: position_load
      stop_loss_node_id: trailing

  - id: timeout_exit
    kind: position_timeout_exit
    config:
      position_node_id: position_load

  - id: observe_position
    kind: observability_emit_position_event
    config:
      position_node_id: position_load
