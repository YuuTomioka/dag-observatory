name: dagruntime.marketdata_timeframe_bar_backfill
version: v1
inputs:
  - marketdata.symbol_code
  - marketdata.timeframe_code
  - marketdata.from
  - marketdata.to
nodes:
  - id: resolve
    kind: marketdata_resolve_symbol
  - id: plan
    kind: marketdata_plan_windows
    config:
      resolve_node_id: resolve
      chunk_size_bars: 1000
  - id: load
    kind: marketdata_load_ticks_for_chunk
    config:
      plan_node_id: plan
  - id: aggregate
    kind: marketdata_aggregate_timeframe_bars
    config:
      load_node_id: load
  - id: persist
    kind: marketdata_persist_timeframe_bars
    config:
      plan_node_id: plan
      aggregate_node_id: aggregate
      mode: replace_range
