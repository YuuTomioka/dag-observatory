[project]
name = "dagruntime-worker-py"
version = "0.1.0"
description = "Python worker for dag-observatory"
requires-python = ">=3.11"
dependencies = [
  "kafka-python>=2.0.2",
  "opentelemetry-api>=1.25.0",
  "psycopg[binary]>=3.2.1",
]

[project.scripts]
worker-py = "worker.main:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
